[package]
name = "tle-gen"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Deterministic language generation: KN-5 + GloVe semantic PoE. Rust 100%, zero dependencies on Python."

[dependencies]
rand = { workspace = true }
rand_chacha = { workspace = true }

[[bin]]
name = "tle-gen"
path = "src/main.rs"

[[bin]]
name = "tle-mpfa"
path = "src/mpfa.rs"

[[bin]]
name = "tle-w2v-mpfa"
path = "src/w2v_mpfa.rs"

[[bin]]
name = "tle-gen-v2"
path = "src/v2_mlp.rs"

[[bin]]
name = "tle-gen-v3"
path = "src/v3.rs"

[[bin]]
name = "tle-train-day1"
path = "src/day1_train.rs"
